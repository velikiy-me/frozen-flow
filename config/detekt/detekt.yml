build:
  maxIssues: 0

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

potential-bugs:
  ImplicitDefaultLocale:
    active: false

exceptions:
  TooGenericExceptionThrown:
    excludes: [ '**/test/**' ]
naming:
  PackageNaming:
    excludes: [ '**/test/**' ]
  InvalidPackageDeclaration:
    rootPackage: 'me.velikiy.frozenflow'
style:
  WildcardImport:
    active: false # https://ktor.io/quickstart/code-style.html#with-star-imports
  MaxLineLength:
    active: false # MaximumLineLength klint wrapper rule is used instead
  UnnecessaryAbstractClass:
    excludes: [ '**/test/**' ]
  UnusedPrivateMember:
    active: false # the rule causes false positive on members used in suspend function
  MagicNumber:
    active: true
    excludes: [ '**/test/**' ]
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: false
    ignoreLocalVariableDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: false
    ignoreNamedArgument: true
    ignoreEnums: false
    ignoreRanges: false
    ignoreExtensionFunctions: true
  ExplicitItLambdaParameter:
    active: false

formatting:
  NoWildcardImports:
    active: false # https://ktor.io/quickstart/code-style.html#with-star-imports
  MaximumLineLength:
    maxLineLength: 120
  PackageName:
    active: false # PackageNaming detekt rule is used instead
  AnnotationOnSeparateLine:
    active: false
  NoEmptyFirstLineInMethodBlock:
    active: false
  TrailingCommaOnDeclarationSite:
    active: true

complexity:
  LongMethod:
    excludes: [ '**/test/**' ]
  TooManyFunctions:
    thresholdInFiles: 15
    ignoreOverridden: true

performance:
  SpreadOperator:
    active: false
