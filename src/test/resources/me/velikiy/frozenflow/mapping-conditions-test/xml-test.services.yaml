test-xml-all-conditions-true:
  proxy-base-url: 'http://localhost:{port}'
  paths:
    - path: '/xml-body'
      mappings:
        - conditions:
            body:
              - ref: '/request/value'
                type: 'exists'
              - ref: '/request/valueAttr/@attr'
                type: 'exists'
              - ref: '/request/value'
                value: 'Some value'
              - ref: '/request/valueAttr/@attr'
                value: 'Some value'
              - ref: '/request/value'
                type: 'regex'
                value: '^Some value$'
              - ref: '/request/valueAttr/@attr'
                type: 'regex'
                value: '^Some value$'
          request:
            patterns:
              body:
                - ref: '/request/value'
                  value: 'Another value'
test-xml-tag-exists-condition-false:
  proxy-base-url: 'http://localhost:{port}'
  paths:
    - path: '/xml-body'
      mappings:
        - conditions:
            body:
              - ref: '/request/nonexistingtag'
                type: 'exists'
          request:
            patterns:
              body:
                - ref: '/request/value'
                  value: 'Another value'
